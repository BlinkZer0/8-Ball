<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Eight Ball</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="plugin">
  <!-- shared SVG defs: knob face, the eight ball -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="knobFace" cx="38%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#5a2430"/>
        <stop offset="60%" stop-color="#2a0b10"/>
        <stop offset="100%" stop-color="#170507"/>
      </radialGradient>
      <radialGradient id="ballFace" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#5a5f68"/>
        <stop offset="45%" stop-color="#16181c"/>
        <stop offset="100%" stop-color="#050607"/>
      </radialGradient>
      <!-- the eight ball, drawn once -->
      <symbol id="eightBall" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="19" fill="url(#ballFace)" stroke="#d9a441" stroke-width="1.2"/>
        <circle cx="20" cy="20" r="9.5" fill="#f3ead8"/>
        <text x="20" y="24.6" class="ball-eight">8</text>
        <ellipse cx="13" cy="11" rx="4.5" ry="2.6" fill="#fff" opacity="0.2" transform="rotate(-30 13 11)"/>
      </symbol>
    </defs>
  </svg>

  <main class="synth">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 40 40" aria-hidden="true"><use href="#eightBall"/></svg>
        <div class="brand-text">
          <span class="brand-mark">EIGHT BALL</span>
          <span class="brand-sub">8-OP FM · v0.5</span>
        </div>
      </div>
      <div class="patch-display">
        <button id="preset-prev" type="button" class="pd-step" aria-label="Previous preset" data-tip="Previous preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 2 4 6l4 4"/></svg>
        </button>
        <div class="pd-text">
          <span id="preset-cat" class="pd-label">PRESET</span>
          <span id="preset-name" class="pd-name"></span>
        </div>
        <button id="preset-next" type="button" class="pd-step" aria-label="Next preset" data-tip="Next preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg>
        </button>
      </div>
      <div class="preset-actions">
        <div class="ab-ctl" data-tip="A/B compare: flip between two sounds; COPY puts the current sound in the other slot">
          <button id="ab-a" type="button" class="ab-btn on">A</button>
          <button id="ab-b" type="button" class="ab-btn">B</button>
          <button id="ab-copy" type="button" class="ab-btn copy">COPY</button>
        </div>
        <button id="preset-init" type="button" class="pd-btn" data-tip="Start from the Init patch">INIT</button>
        <button id="preset-save" type="button" class="pd-btn" data-tip="Save the current sound (replaces a user preset of the same name)">SAVE</button>
        <button id="preset-saveas" type="button" class="pd-btn" data-tip="Save under a new name">SAVE AS</button>
        <button id="preset-load" type="button" class="pd-btn" data-tip="Load a .ebpreset file">LOAD</button>
        <button id="preset-folder" type="button" class="pd-btn" data-tip="Open the user preset folder">FOLDER</button>
      </div>
      <div class="top-controls">
        <label class="midi-pick web-only">
          <span class="ctl-label">MIDI IN</span>
          <select id="midi-select"><option>Detecting…</option></select>
        </label>
        <span class="indicator"><span class="led" id="midi-led" title="Note activity"></span>MIDI</span>
        <span class="indicator"><span class="led" id="sustain-led"></span>SUS</span>
        <span class="indicator voices-ind" data-tip="Voices playing / polyphony">VOICES <b id="voice-count">0</b></span>
        <div class="meter" data-tip="Output level"><div id="meter-fill"></div><div class="meter-clip"></div></div>
        <label class="indicator bpm-ctl" title="Tempo for synced envelopes and LFOs (from the host in the plugin)">
          BPM <input id="bpm-input" type="number" min="20" max="300" step="0.1" value="120" readonly>
        </label>
        <button id="panic-btn" type="button" class="panic" data-tip="Silence everything now">PANIC</button>
      </div>
    </header>

    <nav class="page-tabs" role="tablist" aria-label="Sections">
      <button type="button" class="page-tab" data-page="ops" role="tab">OPERATORS</button>
      <button type="button" class="page-tab" data-page="matrix" role="tab"><span class="led" id="matrix-led"></span>MATRIX</button>
      <button type="button" class="page-tab" data-page="filters" role="tab"><span class="led" id="filters-led"></span>FILTERS</button>
      <button type="button" class="page-tab" data-page="art" role="tab"><span class="led" id="art-led"></span>ARTICULATORS · LFO</button>
      <button type="button" class="page-tab" data-page="fx" role="tab"><span class="led" id="fx-led"></span>FX</button>
      <button type="button" class="page-tab" data-page="presets" role="tab">PRESETS</button>
      <span class="page-hint" id="page-hint"></span>
    </nav>
    <div class="pages">
      <div class="page" data-page="ops"><div id="ops-page" class="ops-page"></div></div>
      <div class="page" data-page="matrix"><div id="matrix-page" class="matrix-page"></div></div>
      <div class="page" data-page="filters"><div id="filters-page" class="filters-page"></div></div>
      <div class="page" data-page="art"><div id="art-page" class="art-page"></div></div>
      <div class="page" data-page="fx"><div id="fx-page" class="fx-page"></div></div>
      <div class="page" data-page="presets">
        <section class="browser" aria-label="Presets">
          <div class="browser-head">
            <div class="cat-tabs" id="cat-tabs" role="tablist"></div>
            <input id="preset-search" type="search" placeholder="search all presets…" spellcheck="false" autocomplete="off" data-tip="Type to search every category (Esc clears)">
          </div>
          <div class="preset-grid" id="preset-grid"></div>
          <div class="browser-foot"><span id="preset-count"></span><span id="preset-folder-path" class="path"></span></div>
        </section>
      </div>
    </div>

    <section class="keybed">
      <div id="wheel-slot"></div>
      <div class="octave-ctl">
        <span class="ctl-label">OCTAVE</span>
        <div class="oct-buttons">
          <button id="oct-down" type="button" aria-label="Octave down" data-tip="Octave down (Z)">−</button>
          <button id="oct-up" type="button" aria-label="Octave up" data-tip="Octave up (X)">+</button>
        </div>
        <span id="octave-readout" class="oct-readout"></span>
        <span class="kbd-hint">Keys: A–' play<br>Z / X octave</span>
      </div>
      <div id="piano" class="piano"></div>
      <div class="global-strip">
        <div id="global-knobs" class="knob-row"></div>
        <div id="global-switches" class="switch-col"></div>
      </div>
    </section>

    <footer class="statusbar">
      <span id="midi-monitor" class="monitor">Connecting to plugin…</span>
      <span class="audio-status"><span class="led" id="audio-led"></span><span id="audio-info">—</span></span>
      <svg class="corner-ball" viewBox="0 0 40 40" aria-hidden="true"><use href="#eightBall"/></svg>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <input id="modal-input" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="pd-btn">CANCEL</button>
        <button id="modal-ok" type="button" class="pd-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="js/params.js"></script>
  <script src="js/engine-juce.js"></script>
  <script src="js/knob.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/envelope.js"></script>
  <script src="js/waveeditor.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/articulators.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
